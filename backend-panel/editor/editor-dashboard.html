<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editor Dashboard - Wrytix</title>
    <link rel="stylesheet" href="../backend-panelCSS/backend-panel.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 1rem;
            color: #555;
        }

        .card p {
            font-size: 1.8rem;
            margin-top: 8px;
            color: #ff6b00;
        }

        .section {
            margin-top: 2rem;
        }

        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            color: #333;
        }

        .list {
            background: #fff;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            max-height: 300px;
            overflow-y: auto;
        }

        .list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        canvas {
            max-width: 100%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <h2>Editor Panel</h2>
        <nav>
            <ul>
                <li><a href="editor-dashboard.html" class="active">Dashboard</a></li>
                <li><a href="editor-add-post.html">Add New Post</a></li>
                <li><a href="editor-posts.html">Manage Posts</a></li>
                <li><a href="editor-posts-approval.html">Post Approval Requests</a></li>
                <li><a href="editor-add-user.html">Add User</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
                </div>
            </div>
        </div>

        <h1>Welcome, Editor</h1>
        <p>You can manage submitted posts, approve or reject them, and oversee author contributions.</p>

        <div class="stats" id="statsContainer">
            <!-- Stats cards will be injected here -->
        </div>

        <div class="section">
            <h2>Top Viewed Posts</h2>
            <canvas id="viewsChart" height="200"></canvas>
        </div>

        <div class="section">
            <h2>Recent Post Submissions</h2>
            <ul class="list" id="recentSubmissions">
                <li>Loading recent submissions...</li>
            </ul>
        </div>
    </main>
</div>

<script src="js/editor-dashboard.js"></script>
<script src="js/editor-panel.js"></script>
<script src="../backend-panelJS/backend-panel.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</body>
</html>
