<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add User - Wrytix Editor</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../backend-panelCSS/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .tooltip {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <h2>Editor Panel</h2>
        <nav>
            <ul>
                <li><a href="editor-dashboard.html" >Dashboard</a></li>
                <li><a href="editor-add-post.html">Add New Post</a></li>
                <li><a href="editor-posts.html" >Manage Posts</a></li>
                <li><a href="editor-posts-approval.html" >Post Approval Requests</a></li>
                <li><a href="editor-add-user.html" class="active">Add User</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
                </div>
            </div>
        </div>

        <h1>Add New Author</h1>
        <form id="addUserForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required />

            <label for="username">Username</label>
            <input type="text" id="username" required />
            <div id="username-status" class="tooltip"></div>

            <label for="email">Email</label>
            <input type="email" id="email" required />
            <div id="email-status" class="tooltip"></div>

            <div style="position: relative;">
                <label for="password">Password</label>
                <input type="password" id="password" required style="padding-right: 40px;" />
                <i id="togglePassword" class="fas fa-eye-slash" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); cursor: pointer; color: #888;"></i>
            </div>

            <label for="role">Role</label>
            <select id="role" required>
                <option value="author">Author - Can write and submit posts</option>
            </select>

            <label for="avatar">Profile Picture (Optional, JPEG/PNG/GIF)</label>
            <input type="file" id="avatar" accept="image/jpeg,image/png,image/gif" />

            <label for="document">Attach Document (Required for approval, PDF only)</label>
            <input type="file" id="document" accept="application/pdf" required />

            <button type="submit">Submit for Approval</button>
        </form>
    </main>
</div>
<script src="js/editor-add-user.js"></script>
<script src="js/editor-panel.js"></script>
<script src="../backend-panelJS/backend-panel.js"></script>
</body>
</html>
