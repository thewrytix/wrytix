<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Submissions - Wrytix</title>
  <link rel="stylesheet" href="../backend-panel.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0;
    }
    .filters select, .filters input[type="date"], .filters button {
      padding: 6px 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }
    th {
      background: #f8f8f8;
    }
    .btn {
      padding: 6px 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .status-approved { color: green; font-weight: bold; }
    .status-rejected { color: red; font-weight: bold; }
    .status-pending { color: orange; font-weight: bold; }
    .pagination {
      margin-top: 1rem;
      display: flex;
      gap: 10px;
    }
    .pagination button {
      padding: 6px 12px;
    }
  </style>
</head>
<body>
<div class="admin-container">
  <aside class="admin-sidebar">
    <h2>Wrytix Author</h2>
    <nav>
      <ul>
        <li><a href="author-dashboard.html">Author Dashboard</a></li>
        <li><a href="author-add-post.html">Submit New Post</a></li>
        <li><a href="author-posts.html" class="active">My Posts</a></li>
      </ul>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="top-bar">
      <div class="profile-dropdown">
        <button class="profile-btn" id="profileBtn">Loading...</button>
        <div class="profile-menu" id="profileMenu">
          <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
        </div>
      </div>
    </div>

    <h1>My Submissions</h1>

    <div class="filters">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <input type="date" id="dateFilter" />
      <button onclick="applyFilters()">Filter</button>
      <button onclick="resetFilters()">Reset</button>
    </div>

    <div id="postsContainer"></div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>
<script src="js/author-posts.js"></script>
<script src="js/author-panel.js"></script>
<script src="../backend-panel.js"></script>
</body>
</html>
