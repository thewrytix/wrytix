<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submit Post - Wrytix Author</title>
    <link rel="stylesheet" href="../backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .formatting-toolbar {
            margin-bottom: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .formatting-toolbar button{
            padding: var(--spacing-sm);
            background-color: var(--primary-color);
            color: var(--neutral-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            height: 30px;
            display: flex;
            text-align: center;
        }

        .formatting-toolbar button i{
            display: flex;
            justify-content: center;
            text-align: center;
            background-color: var(--primary-color);
            color: var(--neutral-color);
        }

        form select{
            padding: 5px 7px;
        }

        .formatting-toolbar select{
            width: 80px;
            height: 30px;
            background-color: var(--primary-color);
            color: var(--neutral-color);
            border: 2px solid var(--border-color);
            text-align: center;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-content: center;
        }

        .formatting-toolbar select option{
            color: var(--neutral-color);
            display: flex;
            justify-content: center;
            align-content: center;
            margin-bottom: 3px;
        }

        .formatting-toolbar label{
            display: flex;
        }

        .formatting-toolbar input[type="color"] {
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            height: 30px;
        }

        .rich-editor {
            border: 1px solid var(--border-color);
            min-height: 200px;
            padding: 1.5em;
            border-radius: 4px;
            background: var(--neutral-color);
            overflow-x: auto;
            resize: vertical;
        }

        .rich-editor table {
            width: 100%;
            border-collapse: collapse;
        }

        .rich-editor th, .rich-editor td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        .status-message {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }

        .status-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <h2>Author Panel</h2>
        <nav>
            <ul>
                <li><a href="author-dashboard.html" >Author Dashboard</a></li>
                <li><a href="author-add-post.html" class="active">Submit New Post</a></li>
                <li><a href="author-posts.html">My Posts</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn">🚪 Logout</button>
                </div>
            </div>
        </div>

        <h1>Submit New Post</h1>
        <div id="statusMsg" class="status-message"></div>

        <form id="submitPostForm">
            <label for="postTitle">Title</label>
            <input type="text" id="postTitle" required />

            <label for="postSlug">Slug</label>
            <input type="text" id="postSlug" required />

            <label for="postAuthor">Author</label>
            <input type="text" id="postAuthor" placeholder="e.g., Arthur Mensah" required />

            <label for="postCategory">Category</label>
            <select id="postCategory" required>
                <option value="" disabled selected>Select a category</option>
                <option value="news">News</option>
                <option value="business">Business</option>
                <option value="foreign">Foreign</option>
                <option value="sports">Sports</option>
                <option value="technology">Technology</option>
                <option value="lifestyle">Lifestyle</option>
            </select>

            <label for="postThumbnail">Thumbnail</label>
            <input type="file" id="postThumbnail" accept="image/*" />
            <div id="thumbnailPreviewContainer" style="margin-top:10px; display:none;">
                <img id="thumbnailPreview" style="max-width:200px; border:1px solid #ccc; border-radius:4px;" />
            </div>

            <label for="postContent">Content</label>
            <div class="formatting-toolbar">
                <button type="button" title="Bold" onclick="formatText('bold')"><i class="fa-solid fa-bold"></i></button>
                <button type="button" title="Italic" onclick="formatText('italic')"><i class="fa-solid fa-italic"></i></button>
                <button type="button" title="Underline" onclick="formatText('underline')"><i class="fa-solid fa-underline"></i></button>
                <label>
                    <input type="color" id="fontColorPicker" title="Font Color" style="height: 30px; width: 25px; border:none; background: transparent; padding: 0;" />
                </label>
                <button type="button" title="Bullets" onclick="formatText('insertUnorderedList')"><i class="fa-solid fa-list-ul"></i></button>
                <button type="button" title="Numbers" onclick="formatText('insertOrderedList')"><i class="fa-solid fa-list-ol"></i></button>
                <button type="button" title="Link" onclick="formatText('createLink')"><i class="fa-solid fa-link"></i></button>
                <button type="button" title="Image" onclick="insertImage()"><i class="fa-solid fa-image"></i></button>
                <input type="file" id="imageUploader" accept="image/*" style="display:none" />
            </div>

            <div id="postContent" contenteditable="true" class="rich-editor" required></div>

            <label for="postSource">Source</label>
            <input type="text" id="postSource" placeholder="Optional source link or reference" />

            <label>
                <input type="checkbox" id="postFeatured" />
                Mark as Featured
            </label>

            <label for="postSchedule">Schedule Date & Time</label>
            <input type="datetime-local" id="postSchedule" />

            <button type="button" id="previewBtn">Preview Post</button>
            <button type="submit">Submit Post</button>
        </form>
    </main>
</div>

<script>
    // Check if user is authenticated
    async function checkAuth() {
        try {
            const response = await fetch('https://wrytix.onrender.com/auth/check', {
                method: 'GET',
                credentials: 'include'
            });

            if (response.ok) {
                const user = await response.json();
                document.getElementById('profileBtn').textContent = user.username || 'User';
                return true;
            } else {
                window.location.href = '../login.html';
                return false;
            }
        } catch (error) {
            console.error('Auth check failed:', error);
            window.location.href = '../login.html';
            return false;
        }
    }

    // Show messages
    function showMessage(message, isError = false) {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.textContent = message;
        statusMsg.className = isError ? 'status-message status-error' : 'status-message status-success';
        statusMsg.style.display = 'block';
        setTimeout(() => statusMsg.style.display = 'none', 5000);
    }

    // Slugify function
    const slugify = (text) => text.toLowerCase().trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w-]+/g, '')
        .replace(/--+/g, '-');

    // Auto-generate slug from title
    document.getElementById('postTitle').addEventListener('input', (e) => {
        document.getElementById('postSlug').value = slugify(e.target.value);
    });

    // Thumbnail preview
    document.getElementById('postThumbnail').addEventListener('change', (e) => {
        const file = e.target.files[0];
        const preview = document.getElementById('thumbnailPreview');
        const container = document.getElementById('thumbnailPreviewContainer');

        if (file) {
            const reader = new FileReader();
            reader.onload = () => {
                preview.src = reader.result;
                container.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // Form submission
    document.getElementById('submitPostForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
            const title = document.getElementById('postTitle').value.trim();
            const slug = document.getElementById('postSlug').value.trim();
            const content = document.getElementById('postContent').innerHTML.trim();
            const author = document.getElementById('postAuthor').value.trim();
            const category = document.getElementById('postCategory').value;
            const source = document.getElementById('postSource').value.trim();
            const isFeatured = document.getElementById('postFeatured').checked;
            const scheduleInput = document.getElementById('postSchedule').value;
            const schedule = scheduleInput ? new Date(scheduleInput).toISOString() : new Date().toISOString();

            // Handle thumbnail
            const file = document.getElementById('postThumbnail').files[0];
            let thumbnail = '';
            if (file) {
                thumbnail = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            }

            const data = {
                title,
                slug,
                content,
                category,
                author,
                source,
                isFeatured,
                schedule,
                thumbnail,
                submittedBy: sessionStorage.getItem('currentUser') || 'anonymous',
                status: 'pending',
                views: 0,
                lastViewed: new Date().toISOString()
            };

            const response = await fetch('https://wrytix.onrender.com/postSubmissions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
                credentials: 'include'
            });

            if (response.ok) {
                showMessage('✅ Post submitted successfully! Awaiting editor review.');
                document.getElementById('submitPostForm').reset();
                document.getElementById('postContent').innerHTML = '';
                document.getElementById('thumbnailPreviewContainer').style.display = 'none';
            } else {
                const error = await response.text();
                throw new Error(error);
            }

        } catch (error) {
            console.error('Submission error:', error);
            if (error.message.includes('Unauthorized')) {
                showMessage('❌ Session expired. Please login again.', true);
                setTimeout(() => window.location.href = '../login.html', 2000);
            } else {
                showMessage('❌ ' + error.message, true);
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Post';
        }
    });

    // Text formatting functions
    function formatText(command, value = null) {
        if (command === 'createLink') {
            const url = prompt("Enter the link URL:");
            if (url) document.execCommand(command, false, url);
        } else {
            document.execCommand(command, false, value);
        }
    }

    function insertImage() {
        document.getElementById('imageUploader').click();
    }

    document.getElementById('imageUploader').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = () => {
                const img = `<img src="${reader.result}" style="max-width:100%;border-radius:4px;" />`;
                document.execCommand('insertHTML', false, img);
            };
            reader.readAsDataURL(file);
            e.target.value = "";
        }
    });

    // Color picker
    document.getElementById('fontColorPicker').addEventListener('input', function() {
        document.execCommand('foreColor', false, this.value);
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', checkAuth);
</script>
<script src="author-panel.js"></script>
<script src="../backend-panel.js"></script>
</body>
</html>
