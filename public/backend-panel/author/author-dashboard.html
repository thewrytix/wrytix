<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Author Dashboard - Wrytix</title>
  <link rel="stylesheet" href="../backend-panelCSS/backend-panel.css"/>
  <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #555;
    }

    .card p {
      font-size: 2rem;
      margin-top: 8px;
      color: #ff6b00;
    }

    .loading {
      text-align: center;
      margin-top: 2rem;
      color: #777;
    }
  </style>
</head>
<body>
<div class="admin-container">
  <aside class="admin-sidebar">
    <h2>Wrytix Author</h2>
    <nav>
      <ul>
        <li><a href="author-dashboard.html" class="active">Author Dashboard</a></li>
        <li><a href="author-add-post.html">Submit New Post</a></li>
        <li><a href="author-posts.html">My Posts</a></li>
      </ul>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="top-bar">
      <div class="profile-dropdown">
        <button class="profile-btn" id="profileBtn">Loading...</button>
        <div class="profile-menu" id="profileMenu">
          <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
        </div>
      </div>
    </div>

    <h1>Welcome, Author Dashboard</h1>
    <p>You can create posts and submit them for editorial review.</p>

    <div class="stats" id="statsContainer">
      <div class="loading">Loading your post stats...</div>
    </div>
  </main>
</div>
<script src="js/author-dashboard.js"></script>
<script src="js/author-panel.js"></script>
<script src="../backend-panelJS/backend-panel.js"></script>
</body>
</html>
