<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">Dashboard - Wrytix</title>
    <link rel="stylesheet" href="/backend-panel/backend-panelCSS/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <h2>Wrytix</h2>
        <nav><ul id="sidebarLinks"></ul></nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <h1 id="dashboardTitle">Dashboard</h1>

        <div class="stats-container" id="statsContainer">
            <p>Loading stats...</p>
        </div>

        <!-- Admin-only sections -->
        <div class="dashboard-sidebar-lists">
            <section><h2>Trending</h2><ul id="trending-posts-list"></ul></section>
            <section><h2>Popular</h2><ul id="popular-posts-list"></ul></section>
            <section><h2>Recent Activity</h2><ul id="activityList"></ul></section>
        </div>

        <!-- Editor-only sections -->
        <section><h2>Top Viewed Posts</h2><ul id="top-viewed-list"></ul></section>
        <section><h2>Recent Submissions</h2><ul id="recentSubmissions"></ul></section>

        <!-- Author-only sections -->
        <section><h2>My Posts</h2><ul id="my-posts-list"></ul></section>
    </main>
</div>

<script src="/backend-panel/admin-panel/adminJS/admin-panel.js"></script>
<script src="/backend-panel/backend-panelJS/backend-panel.js"></script>
<script src="/backend-panel/backend-panelJS/roleConfig.js"></script>
<script src="/backend-panel/backend-panelJS/dashboard.js"></script>
</body>
</html>
