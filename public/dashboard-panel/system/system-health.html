<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>System Health - Wrytix Admin</title>
    <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .health-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .health-card {
            background: var(--neutral-color);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.green {
            background: var(--status-green);
            animation: blink-green 1.5s infinite;
        }

        .status-dot.yellow {
            background: var(--status-neutral);
            animation: blink-yellow 1.5s infinite;
        }

        .status-dot.red {
            background: var(--status-red);
            animation: blink-red 1.5s infinite;
        }

        @keyframes blink-green {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.5); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
        }

        @keyframes blink-yellow {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(215, 154, 44, 0.5); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(215, 154, 44, 0); }
        }

        @keyframes blink-red {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(196, 62, 62, 0.5); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(196, 62, 62, 0); }
        }
        .health-card-info h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        .health-card-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .metrics-section {
            margin: 2rem 0;
            background: var(--neutral-color);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric-item {
            text-align: center;
        }

        .metric-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .metric-item .label {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .refresh-note {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* ---- Page header + system action buttons ---- */
        .health-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0;
        }

        .health-header h1 {
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .system-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: var(--border-radius-md);
            font-family: var(--font-family-secondary);
            font-weight: var(--font-weight-bold);
            font-size: 0.9rem;
            color: var(--neutral-color);
            cursor: pointer;
            transition: filter var(--transition-fast), transform var(--transition-fast);
        }

        .btn-action:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reload {
            background: var(--primary-color);
        }

        .btn-restart {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>
        <footer><p class="copyright">

        </p></footer>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="health-header">
            <h1><i class="fa-solid fa-server"></i> System Health</h1>
            <div class="system-actions">
                <button id="reloadBtn" class="btn-action btn-reload"><i class="fa-solid fa-arrows-rotate"></i> Reload System</button>
                <button id="restartBtn" class="btn-action btn-restart"><i class="fa-solid fa-power-off"></i> Restart Server</button>
            </div>
        </div>

        <div class="health-cards" id="healthCards">
            <p>Loading system status...</p>
        </div>

        <section class="metrics-section">
            <h2>Server Metrics</h2>
            <div class="metrics-grid" id="metricsGrid"></div>
            <p class="refresh-note" id="lastChecked"></p>
        </section>

        <section class="metrics-section">
            <h2>API Endpoint Checks</h2>
            <div class="health-cards" id="endpointChecks">
                <p>Checking endpoints...</p>
            </div>
        </section>

        <div class="quick-links">
            <h2><i class="fa-solid fa-bolt"></i> Quick Links</h2>
            <a href="maintenance.html"><i class="fa-solid fa-wrench"></i> Maintenance Mode & Tasks</a>
            <a href="logs.html"><i class="fa-solid fa-list"></i> View Logs</a>
        </div>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="../js/sideBar.js"></script>
<script src="js/system-health.js"></script>
</body>
</html>
