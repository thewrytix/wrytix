<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>System Health - Wrytix Admin</title>
    <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .health-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .health-card {
            background: var(--neutral-color);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.green {
            background: var(--status-green);
            animation: blink-green 1.5s infinite;
        }

        .status-dot.yellow {
            background: var(--status-neutral);
        }

        .status-dot.red {
            background: var(--status-red);
        }

        @keyframes blink-green {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.5); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
        }

        .health-card-info h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--text-color);
        }

        .health-card-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .metrics-section {
            margin-top: 2rem;
            background: var(--neutral-color);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric-item {
            text-align: center;
        }

        .metric-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .metric-item .label {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .refresh-note {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <h1><i class="fa-solid fa-server"></i> System Health</h1>

        <div class="health-cards" id="healthCards">
            <p>Loading system status...</p>
        </div>

        <section class="metrics-section">
            <h2>Server Metrics</h2>
            <div class="metrics-grid" id="metricsGrid"></div>
            <p class="refresh-note" id="lastChecked"></p>
        </section>

        <section class="metrics-section">
            <h2>API Endpoint Checks</h2>
            <div class="health-cards" id="endpointChecks">
                <p>Checking endpoints...</p>
            </div>
        </section>

        <div class="quick-links">
            <a href="maintenance.html"><i class="fa-solid fa-wrench"></i> Maintenance Mode & Tasks</a>
            <a href="logs.html"><i class="fa-solid fa-list"></i> View Logs</a>
        </div>

        <button id="reloadBtn">Reload System</button>
        <button id="restartBtn">Restart Server</button>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="../js/sideBar.js"></script>
<script src="js/system-health.js"></script>
</body>
</html>
