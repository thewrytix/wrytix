<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Posts - Wrytix Admin</title>
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/formatting_toolbar.css" />
    <style>
        .posts-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .status-tabs { display: flex; gap: 0.5rem; }

        .status-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--neutral-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-tab.active {
            background: var(--primary-color);
            color: var(--neutral-color);
            border-color: var(--primary-color);
        }

        .btn-add-post {
            background: var(--status-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .bulk-bar {
            display: none;
            align-items: center;
            gap: 1rem;
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .bulk-bar.visible { display: flex; }

        .bulk-bar button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Modal — widened, with internal scroll */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .modal-overlay.visible { display: flex; }

        .modal-box {
            background: var(--background-light);
            border-radius: 10px;
            max-width: 960px;
            width: 100%;
            padding: 2rem;
            position: relative;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .row-checkbox { width: 18px; height: 18px; }

        .featured-badge {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="posts-toolbar">
            <h1 style="margin:0;">Posts</h1>
            <button class="btn-add-post" id="openAddModalBtn"><i class="fa-solid fa-plus"></i> Add Post</button>
        </div>

        <div class="status-tabs" id="statusTabs"></div>

        <div id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search title..." />

            <select id="filterCategory">
                <option value="">All Categories</option>
            </select>

            <select id="filterFeatured">
                <option value="">All Posts</option>
                <option value="true">Featured Only</option>
                <option value="false">Not Featured</option>
            </select>

            <input type="text" id="filterAuthor" placeholder="Filter by author..." style="display:none;" />
            <button id="searchBtn">Search</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="bulk-bar" id="bulkBar">
            <span id="bulkCount">0 selected</span>
            <button style="background:var(--status-red);color:white;" id="bulkDeleteBtn"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            <button style="background:var(--border-color);" id="clearSelectionBtn">Clear</button>
        </div>

        <table class="posts-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAllCheckbox" /></th>
                <th>Title</th>
                <th>Category</th>
                <th id="authorColHeader">Author</th>
                <th>Status</th>
                <th>Featured</th>
                <th id="viewsColHeader">Views</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="postsTableBody">
            <tr><td colspan="8">Loading...</td></tr>
            </tbody>
        </table>

        <div id="pagination" class="pagination-controls"></div>
    </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="postModal">
    <div class="modal-box">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 id="modalTitle">Add New Post</h2>

        <form id="postForm">
            <input type="hidden" id="postFormMode" value="add" />
            <input type="hidden" id="postFormSlug" value="" />
            <input type="hidden" id="postFormSource" value="" />

            <label for="postTitleInput">Title</label>
            <input type="text" id="postTitleInput" required />

            <label for="postAuthorInput">Author</label>
            <input type="text" id="postAuthorInput" required />

            <label for="postCategoryInput">Category</label>
            <select id="postCategoryInput" required>
                <option value="">Select a category</option>
            </select>

            <label for="postThumbnailInput">Thumbnail Image <span style="font-weight:normal;">(required)</span></label>
            <input type="file" id="postThumbnailInput" accept="image/*" />
            <div id="thumbnailPreviewContainer" style="display:none;">
                <img id="thumbnailPreview" style="max-width:200px; border:1px solid #ccc; border-radius:4px;" />
            </div>

            <label>Content</label>
            <div class="formatting-toolbar">
                <button type="button" title="Undo" onclick="formatText('undo')"><i class="fa-solid fa-rotate-left"></i></button>
                <button type="button" title="Redo" onclick="formatText('redo')"><i class="fa-solid fa-rotate-right"></i></button>

                <button type="button" title="Bold" onclick="formatText('bold')"><i class="fa-solid fa-bold"></i></button>
                <button type="button" title="Italic" onclick="formatText('italic')"><i class="fa-solid fa-italic"></i></button>
                <button type="button" title="Underline" onclick="formatText('underline')"><i class="fa-solid fa-underline"></i></button>
                <button type="button" title="Strikethrough" onclick="formatText('strikeThrough')"><i class="fa-solid fa-strikethrough"></i></button>

                <select onchange="formatText('fontName', this.value)" title="Font Family">
                    <option value="">Font</option>
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Verdana">Verdana</option>
                </select>

                <select onchange="formatText('fontSize', this.value)" title="Font Size">
                    <option value="">Size</option>
                    <option value="1">Small</option>
                    <option value="3">Normal</option>
                    <option value="5">Large</option>
                    <option value="7">X-Large</option>
                </select>

                <label>
                    <input type="color" id="fontColorPicker" title="Font Color" style="height: 30px; width: 25px; border:none; background: transparent; padding: 0;" />
                </label>
                <label>
                    <input type="color" id="bgColorPicker" title="Background Color" style="height: 30px; width: 25px; border:none; background: transparent; padding: 0;" />
                </label>

                <button type="button" title="Bullets" onclick="formatText('insertUnorderedList')"><i class="fa-solid fa-list-ul"></i></button>
                <button type="button" title="Numbers" onclick="formatText('insertOrderedList')"><i class="fa-solid fa-list-ol"></i></button>

                <select onchange="applyHeading(this)" title="Select Header">
                    <option value="">Header</option>
                    <option value="h1">H1</option>
                    <option value="h2">H2</option>
                    <option value="h3">H3</option>
                    <option value="h4">H4</option>
                </select>

                <button type="button" title="Blockquote" onclick="applyBlockquote()"><i class="fa-solid fa-quote-left"></i></button>

                <button type="button" title="Link" onclick="formatText('createLink')"><i class="fa-solid fa-link"></i></button>
                <button type="button" title="Image" onclick="insertImage()"><i class="fa-solid fa-image"></i></button>
                <button type="button" title="Insert Table" onclick="insertTable()"><i class="fa-solid fa-table"></i></button>
                <button type="button" title="Insert Video" onclick="insertVideo()"><i class="fa-solid fa-video"></i></button>

                <button type="button" title="Align left" onclick="formatText('justifyLeft')"><i class="fa-solid fa-align-left"></i></button>
                <button type="button" title="Align center" onclick="formatText('justifyCenter')"><i class="fa-solid fa-align-center"></i></button>
                <button type="button" title="Align right" onclick="formatText('justifyRight')"><i class="fa-solid fa-align-right"></i></button>
                <button type="button" title="Align justify" onclick="formatText('justifyFull')"><i class="fa-solid fa-align-justify"></i></button>

                <button type="button" title="Inline Code" onclick="formatText('formatBlock', '<code>')"><i class="fa-solid fa-code"></i></button>
                <button type="button" title="Subscript" onclick="formatText('subscript')"><i class="fa-solid fa-subscript"></i></button>
                <button type="button" title="Superscript" onclick="formatText('superscript')"><i class="fa-solid fa-superscript"></i></button>

                <button type="button" title="Clear Formatting" onclick="formatText('removeFormat')"><i class="fa-solid fa-eraser"></i></button>

                <input type="file" id="imageUploader" accept="image/*" style="display:none" />
            </div>

            <div id="postContent" contenteditable="true" class="rich-editor" style="min-height:220px;border:1px solid var(--border-color);border-radius:6px;padding:1rem;background:white;"></div>

            <label for="postSourceInput" style="margin-top:1rem;">Source</label>
            <input type="text" id="postSourceInput" />

            <label><input type="checkbox" id="postFeaturedInput" /> Mark as Featured</label>

            <label for="postScheduleInput">Schedule Publish</label>
            <input type="datetime-local" id="postScheduleInput" />

            <div style="margin-top:1.5rem;display:flex;gap:1rem;">
                <button type="button" id="previewPostBtn" style="background:var(--primary-color);color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">Preview</button>
                <button type="submit" class="btn-add-post">Save</button>
                <button type="button" id="cancelModalBtn" style="background:var(--border-color);border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="../js/sideBar.js"></script>
<script src="js/posts.js"></script>
<script src="../js/richEditor.js"></script>
</body>
</html>
