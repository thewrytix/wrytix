<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Wrytix Admin</title>
    <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
<div class="login-container">
    <div class="login-container__glow"></div>
    <div class="login-box">
        <div class="logo-container">
            <div class="logo-icon">W</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to access Wrytix Backend Panel</p>
        </div>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="input-group">
                <i class="fa-solid fa-user input-icon" aria-hidden="true"></i>
                <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        placeholder="Username"
                        autocomplete="username"
                />
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Password"
                        autocomplete="current-password"
                />
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>

            <button type="submit"><span>Sign In</span></button>
        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
