<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Categories - Wrytix Admin</title>
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="posts-toolbar">
            <h1 style="margin:0;"><i class="fa-solid fa-tags"></i> Categories</h1>
            <button class="btn-add-post" id="openAddModalBtn"><i class="fa-solid fa-plus"></i> Add Category</button>
        </div>

        <table class="posts-table">
            <thead>
            <tr><th>Name</th><th>Editor</th><th>Authors</th><th>Actions</th></tr>
            </thead>
            <tbody id="categoriesTableBody">
            <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </main>
</div>

<div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 id="modalTitle">Add New Category</h2>

        <form id="categoryForm">
            <input type="hidden" id="categoryFormMode" value="add" />
            <input type="hidden" id="categoryFormId" value="" />

            <label for="categoryNameInput">Category Name</label>
            <input type="text" id="categoryNameInput" required />

            <label for="categoryEditorInput">Editor</label>
            <select id="categoryEditorInput" required>
                <option value="">-- Select Editor --</option>
            </select>

            <label>Authors</label>
            <div id="categoryAuthorsCheckboxes" style="max-height:200px;overflow-y:auto;border:1px solid var(--border-color);border-radius:6px;padding:0.75rem;margin-bottom:1rem;">
                Loading authors...
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn-add-post">Save</button>
                <button type="button" class="btn-modal-cancel" id="cancelModalBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="../js/sideBar.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
