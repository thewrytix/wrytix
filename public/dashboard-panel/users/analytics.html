<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Visit Analytics - Wrytix Admin</title>
    <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .analytics-filters {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .range-tab.active { background: var(--primary-color); color: var(--neutral-color); border-color: var(--primary-color); }

        .custom-range { display: none; align-items: center; gap: 0.5rem; }
        .custom-range.visible { display: flex; }

        .analytics-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 900px) {
            .analytics-grid { grid-template-columns: 1fr; }
        }

        .chart-section, .geo-section {
            background: var(--neutral-color);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .geo-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .geo-row:last-child { border-bottom: none; }

        .geo-flag { font-size: 1.4rem; }

        .geo-country-name { flex: 1; font-weight: 600; }

        .geo-bar-track {
            flex: 2;
            background: var(--background-light);
            border-radius: 4px;
            height: 10px;
            overflow: hidden;
        }

        .geo-bar-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
        }

        .geo-count { min-width: 40px; text-align: right; font-weight: 700; }

        .range-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>

        <footer><p class="copyright">

        </p></footer>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <h1><i class="fa-solid fa-chart-line"></i> Visit Analytics</h1>

        <div class="analytics-filters">
            <div class="status-tabs" id="rangeTabs">
                <button class="status-tab range-tab active" data-range="daily">This Week</button>
                <button class="status-tab range-tab" data-range="weekly">This Month</button>
                <button class="status-tab range-tab" data-range="monthly">This Year</button>
                <button class="status-tab range-tab" data-range="yearly">Last 5 Years</button>
                <button class="status-tab range-tab" data-range="custom">Custom</button>
            </div>

            <div class="custom-range" id="customRangeInputs">
                <input type="date" id="fromDate" />
                <span>to</span>
                <input type="date" id="toDate" />
                <button id="applyCustomRangeBtn" class="btn-add-post">Apply</button>
            </div>
        </div>

        <p class="range-label" id="rangeLabel"></p>

        <div class="stats-container" id="analyticsSummary">
            <div class="stat-box"><h2 id="totalVisitsValue">0</h2><p>Total Visits</p></div>
            <div class="stat-box"><h2 id="anonymousVisitsValue">0</h2><p>Anonymous</p></div>
            <div class="stat-box"><h2 id="loggedInVisitsValue">0</h2><p>Logged-in</p></div>
        </div>

        <div class="analytics-grid">
            <section class="chart-section">
                <h2>Visits Over Time</h2>
                <canvas id="visitsChart" height="110"></canvas>
            </section>

            <section class="geo-section">
                <h2>Top Countries</h2>
                <div id="geoList"><p>Loading...</p></div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="../js/sideBar.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
