<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ads - Wrytix Admin</title>
    <link rel="icon" sizes="32x32" href="../../images/favicon-32.svg">
    <link rel="stylesheet" href="../css/backend-panel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h2><span class="sidebar-label">Wrytix</span></h2>
            <button id="sidebarCollapseBtn" class="sidebar-collapse-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
        <nav><ul id="sidebarLinks"></ul></nav>
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profileBtn">Loading...</button>
                <div class="profile-menu" id="profileMenu">
                    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="posts-toolbar">
            <h1 style="margin:0;">Ads</h1>
            <button class="btn-add-post" id="openAddModalBtn"><i class="fa-solid fa-plus"></i> Add Ad</button>
        </div>

        <div class="status-tabs" id="statusTabs">
            <button class="status-tab active" data-status="all">All</button>
            <button class="status-tab" data-status="active">Active</button>
            <button class="status-tab" data-status="inactive">Inactive</button>
            <button class="status-tab" data-status="expired">Expired</button>
        </div>

        <div id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search company..." />
            <select id="filterCategory">
                <option value="">All Categories</option>
                <option value="homepage">Home Page</option>
                <option value="news">News</option>
                <option value="business">Business</option>
                <option value="foreign">Foreign</option>
                <option value="opinion">Opinion</option>
                <option value="sports">Sports</option>
                <option value="technology">Technology</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="view-post">View-Post</option>
            </select>
            <button id="searchBtn">Search</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="bulk-bar" id="bulkBar">
            <span id="bulkCount">0 selected</span>
            <button class="btn-bulk-delete" id="bulkDeleteBtn"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            <button style="background:var(--status-green);color:white;" id="bulkActivateBtn">Activate</button>
            <button style="background:var(--status-neutral);color:white;" id="bulkDeactivateBtn">Deactivate</button>
            <button class="btn-bulk-clear" id="clearSelectionBtn">Clear</button>
        </div>

        <table class="ads-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAllCheckbox" /></th>
                <th>Preview</th>
                <th>Type</th>
                <th>Category</th>
                <th>Company</th>
                <th>Start</th>
                <th>End</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="adsTableBody">
            <tr><td colspan="9">Loading...</td></tr>
            </tbody>
        </table>

        <div id="pagination" class="pagination-controls"></div>
    </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="adModal">
    <div class="modal-box">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 id="modalTitle">Add New Ad</h2>

        <form id="adForm">
            <input type="hidden" id="adFormMode" value="add" />
            <input type="hidden" id="adFormId" value="" />
            <input type="hidden" id="currentAdFileUrl" value="" />

            <label for="adTypeInput">Ad Type</label>
            <select id="adTypeInput" required>
                <option value="">-- Select Type --</option>
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="html">HTML Embed</option>
                <option value="text">Text</option>
            </select>

            <!-- Shown only for Image / Video ad types -->
            <div id="uploadFieldGroup" class="ad-field-group">
                <label for="adFileInput">Upload Image/Video</label>
                <input type="file" id="adFileInput" accept="image/*,video/*" />
                <div id="filePreviewContainer" style="display:none;">
                    <img id="filePreviewImg" style="max-width:200px;display:none;border:1px solid #ccc;border-radius:6px;" />
                    <video id="filePreviewVideo" style="max-width:200px;display:none;border:1px solid #ccc;border-radius:6px;" controls></video>
                </div>
            </div>

            <!-- Shown only for HTML Embed ad type -->
            <div id="htmlFieldGroup" class="ad-field-group">
                <label for="adHtmlInput">Embed Code (HTML type)</label>
                <textarea id="adHtmlInput" rows="4"></textarea>
            </div>

            <!-- Shown only for Text ad type -->
            <div id="textFieldGroup" class="ad-field-group">
                <label for="adTextInput">Text Content (Text type)</label>
                <textarea id="adTextInput" rows="3"></textarea>
            </div>

            <label for="adLinkInput">Link (optional)</label>
            <input type="url" id="adLinkInput" placeholder="https://example.com" />

            <label for="adCompanyInput">Company Name</label>
            <input type="text" id="adCompanyInput" required />

            <label for="adCategoryInput">Category</label>
            <select id="adCategoryInput" required>
                <option value="">-- Select Category --</option>
                <option value="homepage">Home Page</option>
                <option value="news">News</option>
                <option value="business">Business</option>
                <option value="foreign">Foreign</option>
                <option value="opinion">Opinion</option>
                <option value="sports">Sports</option>
                <option value="technology">Technology</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="view-post">View-Post</option>
                <option value="home-category">Home-Category</option>
                <option value="contact">ContactPage</option>
                <option value="about">About Page</option>
            </select>

            <!-- Shown only when Category = Home-Category -->
            <div id="positionFieldGroup" class="ad-field-group">
                <label for="adPositionInput">Homepage Category Position</label>
                <select id="adPositionInput">
                    <option value="">-- Select Position --</option>
                    <option value="news">News</option>
                    <option value="business">Business</option>
                    <option value="foreign">Foreign</option>
                    <option value="sports">Sports</option>
                    <option value="technology">Technology</option>
                    <option value="lifestyle">Lifestyle</option>
                </select>
            </div>

            <div style="display:flex; gap:1rem;">
                <div style="flex:1;">
                    <label for="adStartDateInput">Start Date</label>
                    <input type="date" id="adStartDateInput" required />
                </div>
                <div style="flex:1;">
                    <label for="adEndDateInput">End Date</label>
                    <input type="date" id="adEndDateInput" required />
                </div>
            </div>

            <label><input type="checkbox" id="adActiveInput" checked /> Active</label>

            <div class="modal-actions">
                <button type="submit" class="btn-add-post">Save</button>
                <button type="button" class="btn-modal-cancel" id="cancelModalBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/roleConfig.js"></script>
<script src="js/ads.js"></script>
<script src="../js/sideBar.js"></script>
</body>
</html>
