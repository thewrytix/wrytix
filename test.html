<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Wrytix Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .login-container {
      min-height: 100vh;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f1f1f 0%, #2e2e2e 100%);
      position: relative;
      padding: 20px;
      overflow: hidden;
    }

    /* Animated background particles */
    .login-container::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
              radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .login-box {
      background: #f9f9f9;
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #1A237E 0%, #0D47A1 100%);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(26, 35, 126, 0.4);
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    h2 {
      color: #2d3748;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      background-color: #ffffff;
      transition: all 0.3s ease;
      color: #2d3748;
    }

    .input-group input:focus {
      outline: none;
      border-color: #1A237E;
      background-color: white;
      box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
    }

    .input-group input::placeholder {
      color: #a0aec0;
    }

    .input-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      font-size: 1.1rem;
    }

    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1A237E 0%, #0D47A1 100%);
      border: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(26, 35, 126, 0.4);
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 35, 126, 0.5);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    /* Toast notifications */
    .alert {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: slideInDown 0.4s ease-out;
      min-width: 300px;
      text-align: center;
    }

    .alert.error {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .alert.success {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    @keyframes slideInDown {
      from {
        top: -100px;
        opacity: 0;
      }
      to {
        top: 30px;
        opacity: 1;
      }
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .login-box {
        padding: 40px 30px;
      }

      h2 {
        font-size: 1.5rem;
      }

      .logo-icon {
        width: 60px;
        height: 60px;
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo-container">
      <div class="logo-icon">W</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to access Wrytix Backend Panel</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <input
                type="text"
                id="username"
                name="username"
                required
                placeholder="Username"
        />
        <span class="input-icon">👤</span>
      </div>

      <div class="input-group">
        <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Password"
        />
        <span class="input-icon">🔒</span>
      </div>

      <button type="submit">Sign In</button>
    </form>
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const username = loginForm.username.value.trim();
    const password = loginForm.password.value.trim();

    try {
      const res = await fetch('https://wrytix.onrender.com/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (res.ok && data.user) {
        const { username, role } = data.user;
        sessionStorage.setItem('loggedIn', 'true');
        sessionStorage.setItem('user', JSON.stringify(data.user));
        showSuccess("Login successful!");

        setTimeout(() => {
          switch (role) {
            case 'admin':
              window.location.href = 'admin-panel/admin-dashboard.html';
              break;
            case 'editor':
              window.location.href = 'editor/editor-dashboard.html';
              break;
            case 'author':
              window.location.href = 'author/author-dashboard.html';
              break;
            default:
              showError('Unknown role. Contact admin.');
          }
        }, 1200);
      } else {
        if (res.status === 403 && data.error?.includes('suspended')) {
          showError('Account suspended. Please contact administrator.');
        } else if (res.status === 403 && data.error?.includes('inactive')) {
          showError('Account inactive. Please contact administrator.');
        } else {
          showError('Invalid username or password.');
        }
      }
    } catch (err) {
      console.error('Login failed:', err);
      showError('Server error. Try again.');
    }
  });

  function showError(message) {
    const alertBox = document.createElement('div');
    alertBox.className = 'alert error';
    alertBox.textContent = message;
    document.body.appendChild(alertBox);
    setTimeout(() => alertBox.remove(), 5000);
  }

  function showSuccess(message) {
    const alertBox = document.createElement('div');
    alertBox.className = 'alert success';
    alertBox.textContent = message;
    document.body.appendChild(alertBox);
    setTimeout(() => alertBox.remove(), 5000);
  }
</script>
</body>
</html>
